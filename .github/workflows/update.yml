name: Mise à jour Swiss Lotto

on:
  schedule:
    # Exécution chaque mercredi et samedi à 21:30 UTC (~22h30 ou 23h30 en Suisse)
    - cron: '30 21 * * 3,6'
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

permissions:
  contents: write # Requis pour autoriser le bot à faire un "git push"

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances d'extraction
        run: npm install axios cheerio

      - name: Exécuter le script de mise à jour
        run: node scripts/update-latest.js

      - name: Valider et pousser si des changements existent
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/draws.json
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "chore(data): actualisation tirage Swiss Lotto [skip ci]"
            git push origin main
          fi